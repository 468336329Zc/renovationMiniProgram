name: Android Admin Release

on:
  push:
    branches: [main]
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-admin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set build version
        run: |
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          echo "APP_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::未配置 ANDROID_KEYSTORE_BASE64。请在仓库 Settings → Secrets and variables → Actions 添加签名密钥后再构建。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/demo-release.jks
          test -s keystore/demo-release.jks
          STORE_TYPE=$(keytool -list -keystore keystore/demo-release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/Keystore type/{print $2}')
          if [ "$STORE_TYPE" = "PKCS12" ]; then
            echo "检测到 PKCS12：key 口令与 store 口令一致"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
          else
            echo "检测到 JKS：尝试解锁并把 key 口令归一为 store 口令"
            UNLOCKED=0
            ASCII_ALT="${KEY_PASSWORD//！/!}"
            for CAND in "$KEY_PASSWORD" "$ASCII_ALT" "$KEYSTORE_PASSWORD"; do
              if keytool -keypasswd -alias "$KEY_ALIAS" -keystore keystore/demo-release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$CAND" -new "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
                UNLOCKED=1
                break
              fi
            done
            if [ "$UNLOCKED" != "1" ]; then
              echo "::error::无法解锁签名私钥，请检查 ANDROID_KEY_PASSWORD 与 ANDROID_KEY_ALIAS。"
              exit 1
            fi
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
          fi
          echo "ANDROID_KEYSTORE_PATH=$PWD/keystore/demo-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "使用 GitHub Secrets 注入的固定签名密钥"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -5

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: renovation-admin-apk
          path: android-admin/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-v${{ env.APP_VERSION_NAME }}
          name: 装修记 · 管理员端 v${{ env.APP_VERSION_NAME }}
          body: |
            Android 管理员端原生 APK（本地 SQLite 演示数据）。
            构建：Gradle + JDK 17；如未配置签名 Secrets，则使用 CI 临时演示 keystore。
          files: android-admin/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
