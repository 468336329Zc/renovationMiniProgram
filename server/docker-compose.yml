services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${DB_NAME:-renovation}
      MYSQL_USER: ${DB_USER:-renovation_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "0"
      PORT: "5000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-renovation}
      DB_USER: ${DB_USER:-renovation_app}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_TIMEZONE: "+08:00"
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      JWT_USER_SECRET: ${JWT_USER_SECRET}
      MFA_SECRET_KEY: ${MFA_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      EXPORT_UNLOCK_SECRET: ${EXPORT_UNLOCK_SECRET}
      EXPORT_UNLOCK_MODE: ${EXPORT_UNLOCK_MODE:-demo}
      ADMIN_MFA_REQUIRED: "true"
      ALLOW_DEMO_LOGIN: "false"
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads:/app/uploads

volumes:
  mysql_data:
  uploads:
