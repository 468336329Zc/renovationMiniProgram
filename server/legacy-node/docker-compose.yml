services:
  mysql:
    image: mysql:8.0
    container_name: renovation-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${DB_NAME:-renovation}
      MYSQL_USER: ${DB_USER:-renovation_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 6s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mysql_data:
